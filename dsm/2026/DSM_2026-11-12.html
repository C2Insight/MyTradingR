  T.forEach((t, i) => { const z = zone(t); if (bands.length && bands.at(-1)[2] === z) bands.at(-1)[1] = i; else bands.push([i, i, z]); });
  let html = `<div class="tl-row tl-band"><span></span>${bands.map(([a, b, z]) =>
    `<span class="b ${ZONES[z][0]}" style="grid-column:${a + 2} / ${b + 3}" title="${ZONES[z][1]}">${b - a > 10 ? ZONES[z][1] : ""}</span>`).join("")}</div>`;
  [...S].sort((a, b) => a.firstHhmm.localeCompare(b.firstHhmm) || b.tv - a.tv).forEach(s => {
    html += `<div class="tl-row" data-code="${s.code}"><a class="tl-name" href="#s-${s.code}" title="${esc(s.name)} · 최초 ${s.firstHhmm}">${esc(s.name)}</a>`;
    for (let i = 0; i < N; i++) {
      const cls = s.series[i] ? (s.met[i] ? `u${bucket(s.flus[i])}` : "trk") : "";
      const post = s.posts.some(p => p[1] === i) ? " post" : "";
      html += `<span class="c ${cls}${post}" data-i="${i}"></span>`;
    }
    html += `</div>`;
  });
  html += `<div class="tl-row tl-axis"><span></span>${["09:00", "12:00", "15:30", "20:00"].map(t => [T.indexOf(t), t]).filter(([i]) => i >= 0)
    .map(([i, t]) => `<span style="grid-column:${i + 2}">${t}</span>`).join("")}</div><div class="tl-cursor" id="tlcur" hidden></div>`;
  tl.innerHTML = html;

  const readout = document.getElementById("readout"), cur = document.getElementById("tlcur");
  function showCell(cell) {
    const row = cell.parentElement, s = BY_CODE[row.dataset.code], i = +cell.dataset.i;
    tl.querySelectorAll(".tl-row.hl").forEach(r => r.classList.remove("hl"));
    row.classList.add("hl");
    cur.hidden = false;
    Object.assign(cur.style, { left: cell.offsetLeft + "px", top: cell.offsetTop + "px", width: cell.offsetWidth + "px", height: cell.offsetHeight + "px" });
    if (!s.series[i]) {
      readout.innerHTML = `<b class="num">${T[i]}</b> · <b>${esc(s.name)}</b> — ${T[i] < s.firstHhmm ? `포착 전 (최초 포착 ${s.firstHhmm})` : "이 회차 기록 없음"}`;
      return;
    }
    const post = s.posts.find(p => p[1] === i);
    readout.innerHTML = `<b class="num">${T[i]}</b> <span class="muted">${i + 1}/${N}회</span> · <b>${esc(s.name)}</b> · ${sp(s.flus[i])} · ` +
      `<span class="num">${won(s.prices[i])}원</span> · ${s.ranks[i]}위 · <span class="num">${eok(s.tvs[i])} ×${(s.tvs[i] / s.avg).toFixed(1)}</span> · ` +
      (s.met[i] ? "조건 충족" : "조건 미달") +
      (post && post[2] ? ` · <a href="${esc(post[2])}">${post[3] === "new" ? "최초 상세" : "재료 추가"} 메시지 ↗</a>` : "");
  }
  tl.addEventListener("pointerover", e => { const c = e.target.closest(".c"); if (c && e.pointerType === "mouse") showCell(c); });
  tl.addEventListener("click", e => { const c = e.target.closest(".c"); if (c) showCell(c); });

  // ── 총괄표 ──────────────────────────────────────────────
  function rangeSvg(s) {
    const x = p => 4 + (Math.max(-5, Math.min(30, p)) + 5) / 35 * 104;
    return `<svg width="112" height="20" viewBox="0 0 112 20" role="img" aria-label="저가 ${pct(s.lowFlu)} 고가 ${pct(s.highFlu)} 포착 ${pct(s.firstFlu)} 종가 ${pct(s.flu)}">` +
      `<line class="rg-track" x1="4" y1="10" x2="108" y2="10"/>` +
      (s.lowFlu != null && s.highFlu != null ? `<rect class="rg-bar" x="${x(s.lowFlu)}" y="6" width="${Math.max(2, x(s.highFlu) - x(s.lowFlu))}" height="8" rx="2"/>` : "") +
      `<line class="rg-zero" x1="${x(0)}" y1="3" x2="${x(0)}" y2="17"/>` +
      `<rect class="rg-close" x="${x(s.flu) - 1}" y="3" width="2" height="14"/>` +
      (s.firstFlu != null ? `<circle class="rg-first" cx="${x(s.firstFlu)}" cy="10" r="3.5"/>` : "") + `</svg>`;
  }
  const COLS = [
    { t: "종목", cls: "name", key: s => s.name, asc: true, td: s => `<a href="#s-${s.code}">${esc(s.name)}</a><span class="sub">${s.mkt} · ${s.code}</span>` },
    { t: "최초 포착", key: s => s.firstHhmm, asc: true, td: s => `<span class="num">${s.firstHhmm}</span><span class="sub">${s.firstSlot != null ? `${s.firstSlot + 1}회차 · ${s.ranks[s.firstSlot]}위` : "회차 기록 전"}</span>` },
    { t: "종가", key: s => s.price, td: s => `<span class="num">${won(s.price)}</span>` },
    { t: "등락률", key: s => s.flu, td: s => sp(s.flu) + limitChip(s) },
    { t: "포착 후", key: s => s.after ?? -999, td: s => `${sp(s.after, 1)}<span class="sub num">${s.firstPrice ? won(s.firstPrice) + " →" : "포착가 기록 없음"}</span>` },
    { t: "일중 범위", cls: "l", td: rangeSvg },
    { t: "거래대금", key: s => s.tv, td: s => `<span class="num">${eok(s.tv)}</span>` },
    { t: `${C.avgDays}일 배수`, key: s => s.surge, td: s => `<span class="num">×${s.surge.toFixed(1)}</span><span class="sub num">평균 ${eok(s.avg)}</span>` },
    { t: "순위", key: s => s.rank, asc: true, td: s => `<span class="num">${s.rank}위</span><span class="sub">최고 ${s.bestRank}위</span>` },
    { t: "시총", key: s => s.mac, td: s => `<span class="num">${eok(s.mac)}</span>` },
    { t: "충족 회차", key: s => s.metCount, td: s => `<span class="num">${s.metCount}/${s.tracked}회</span><span class="sub">포착 이후 기록</span>` },
    { t: "재료", cls: "l", key: s => s.mat.length, td: s => s.mat.length ? `뉴스 ${s.news} · 공시 ${s.disc}` : `<span class="muted">불분명</span>` },
    { t: "메모", cls: "l", key: s => memoText(DATE, s.code) ? 1 : 0, td: s => memoText(DATE, s.code) ?
        `<span class="memo-snip" title="${esc(memoText(DATE, s.code))}">${esc(memoText(DATE, s.code))}</span>` : `<span class="muted">—</span>` },
  ].filter(c => HOSTED || c.t !== "메모");
  const FILTERS = [["전체", s => true], ["상한가", s => s.upper], ["코스피", s => s.mkt === "KOSPI"], ["코스닥", s => s.mkt === "KOSDAQ"],
    ["재료 불분명", s => !s.mat.length], ["메모 있음", s => !!memoText(DATE, s.code)]].filter(([t]) => HOSTED || t !== "메모 있음");
  let sortCol = 6, sortAsc = false, filt = 0;
  const table = document.getElementById("sumtable"), fbox = document.getElementById("filters");
  function renderTable() {
    table.tHead.innerHTML = `<tr>${COLS.map((c, k) => `<th class="${c.cls || ""}" scope="col"${k === sortCol ? ` aria-sort="${sortAsc ? "ascending" : "descending"}"` : ""}>` +
      (c.key ? `<button type="button" data-k="${k}">${c.t}</button>` : c.t) + `</th>`).join("")}</tr>`;
    const key = COLS[sortCol].key;
    const rows = S.filter(FILTERS[filt][1]).sort((a, b) => {
      const va = key(a), vb = key(b);
      const r = typeof va === "string" ? va.localeCompare(vb, "ko") : va - vb;
      return sortAsc ? r : -r;
    });
    table.tBodies[0].innerHTML = rows.map(s => `<tr>${COLS.map(c => `<td class="${c.cls || ""}">${c.td(s)}</td>`).join("")}</tr>`).join("");
  }
  function renderFilters() {
    fbox.innerHTML = FILTERS.map(([t, f], k) => `<button type="button" class="fbtn" data-f="${k}" aria-pressed="${k === filt}">${t} ${S.filter(f).length}</button>`).join("");
  }
  table.addEventListener("click", e => {
    const b = e.target.closest("th button"); if (!b) return;
    const k = +b.dataset.k;
    if (k === sortCol) sortAsc = !sortAsc; else { sortCol = k; sortAsc = !!COLS[k].asc; }
    renderTable();
  });
  fbox.addEventListener("click", e => { const b = e.target.closest(".fbtn"); if (!b) return; filt = +b.dataset.f; renderFilters(); renderTable(); });
  renderFilters(); renderTable();

  // ── 종목 카드 ───────────────────────────────────────────
  const YOY_ABBR = { "흑자전환": "흑전", "적자전환": "적전", "적자지속": "적지", "흑자지속": "흑지" };
  function yoyCell(y) {
    if (y == null || String(y).trim() === "" || y === "-") return "";
    const n = parseFloat(String(y).replace(/,/g, ""));
    if (!isNaN(n)) return `<small class="${dir(n)}">${pct(n, 1)}</small>`;
    const t = YOY_ABBR[y] || y;
    return `<small class="${t.startsWith("흑") ? "up" : "down"}">${esc(t)}</small>`;
  }
  function finTable(f) {
    if (!f) return `<h3>실적·컨센서스</h3><p class="muted" style="margin:0">없음</p>`;
    const hasP = f.rows.some(r => r[1] === "P");
    const tr = ([label, st, v, y], k) => `<tr${k === f.nq && k > 0 ? ` class="gap"` : ""}><td>${esc(label.replace(/[PE]$/, ""))}${st === "P" || st === "E" ? `<span class="st">${st}</span>` : ""}</td>` +
      v.map((x, j) => `<td>${won(x)}${yoyCell(y[j])}</td>`).join("") + `</tr>`;
    return `<h3>${f.est ? "컨센서스" : "실적"} <small>억원 · YoY${f.est ? " · E 추정" : ""}${hasP ? " · P 잠정" : ""}${f.est ? "" : " · 컨센서스 없음"}</small></h3>` +
      `<div class="table-wrap"><table class="fin"><thead><tr><th>기간</th><th>매출액</th><th>영업이익</th><th>순이익</th></tr></thead><tbody>` +
      f.rows.map(tr).join("") + `</tbody></table></div>`;
  }
  function materials(s) {
    if (!s.mat.length) return `<h3>재료</h3><p class="none">재료 불분명 — 직전 거래일~당일 특징주 뉴스·공시 없음</p>`;
    // 회차 기록을 시작한 회차에 처음 본 재료는 그 전부터 있었을 수 있어 시각을 '기록 전'으로 둔다
    const startT = D.firstRecorded > 0 ? T[D.firstRecorded] : null;
    return `<h3>재료 <small>처음 확인한 시각 · 누르면 원문</small></h3><ol>` + s.mat.map(m => {
      const known = !startT || m.hhmm > startT;
      const add = known && m.hhmm > s.firstHhmm;
      const day = m.date && m.date !== DATE ? `(${md(m.date)}) ` : "";
      return `<li><time>${known ? m.hhmm : "기록 전"}</time><span class="tag${add ? " add" : ""}">${m.kind}${add ? " 추가" : ""}</span>` +
        `<span><a href="${esc(m.url)}" target="_blank" rel="noopener">${day}${esc(m.title)}</a><span class="src">${m.kind === "공시" ? "DART 공시 뷰어" : esc(host(m.url))}</span></span></li>`;
    }).join("") + `</ol>`;
  }
  function historyList(s) {
    if (!s.history.length) return `<p class="muted" style="margin:6px 0 0;font-size:13px">이전 리포트 기록 없음 — 오늘 처음 실림</p>`;
    return `<ol class="hist">${s.history.map(([d, f]) => {
      const note = memoText(d, s.code);
      return `<li><span class="num">${md(d)}</span>${sp(f)}` +
        (HOSTED ? `<span class="hist-note">${note ? esc(note) : `<span class="muted">메모 없음</span>`}</span>` : "") + `</li>`;
    }).join("")}</ol>`;
  }
  const memoBox = s => HOSTED ? `
        <aside class="memo" aria-label="${esc(s.name)} 메모">
          <h3>내 메모 <small>${md(DATE)} 리포트 · 입력하면 자동 저장</small></h3>
          <textarea id="memo-${s.code}" data-code="${s.code}" rows="5" placeholder="판단 근거, 매매 계획, 다음에 확인할 점" disabled></textarea>
          <div class="memo-row"><span class="status" id="st-${s.code}" aria-live="polite">불러오는 중…</span></div>
          <div><h3>이전 기록 <small>이 종목이 실린 지난 리포트</small></h3><div id="hist-${s.code}">${historyList(s)}</div></div>
        </aside>` : `
        <aside class="memo" aria-label="${esc(s.name)} 이전 기록">
          <h3>내 메모</h3>
          <p class="memo-off">메모는 투자 리서치 허브에서 씁니다. 어느 기기에서 열어도 같은 메모가 보입니다.</p>
          ${HUB_LINK ? `<a class="btn" href="${esc(HUB_LINK)}" target="_blank" rel="noopener">사이트에서 열기 ↗</a>` : ""}
          <div><h3>이전 기록 <small>이 종목이 실린 지난 리포트</small></h3>${historyList(s)}</div>
        </aside>`;
  const cards = document.getElementById("cards");
  cards.innerHTML = S.map(s => `
    <details class="card" id="s-${s.code}" open>
      <summary>
        <span class="s-top"><span class="s-rank">${s.rank}위</span><span class="s-name">${esc(s.name)}</span><span class="s-mkt">${s.mkt} · ${s.code}</span><span class="s-chev" aria-hidden="true">▾</span></span>
        <span class="s-metrics">
          <span><span class="num">${won(s.price)}원</span> ${sp(s.flu)}${limitChip(s)}</span>
          <span><span class="k">거래대금</span><span class="num">${eok(s.tv)}</span> <span class="muted num">×${s.surge.toFixed(1)}</span></span>
          <span><span class="k">시총</span><span class="num">${eok(s.mac)}</span></span>
          <span class="chip memo-chip" data-chip="${s.code}"${memoText(DATE, s.code) ? "" : " hidden"}>메모</span>
        </span>
      </summary>
      <div class="card-body">
        <div class="col">
          <dl class="kv">
            <div><dt>최초 포착</dt><dd>${s.firstPrice ? `<span class="num">${s.firstHhmm} · ${won(s.firstPrice)}원</span> ${sp(s.firstFlu)}` : `<span class="num">${s.firstHhmm}</span> <span class="muted">포착가 기록 없음</span>`}</dd></div>
            <div><dt>포착 후 (종가 기준)</dt><dd>${sp(s.after, 1)}</dd></div>
            <div><dt>시가 · 고가 · 저가</dt><dd class="num">${pct(s.openFlu, 1)} · <span class="up">${pct(s.highFlu, 1)}</span> · ${pct(s.lowFlu, 1)}</dd></div>
            <div><dt>${C.avgDays}일 평균 거래대금</dt><dd><span class="num">${eok(s.avg)}</span> <span class="muted">오늘 ×${s.surge.toFixed(1)}</span></dd></div>
            <div><dt>거래대금 순위</dt><dd><span class="num">${s.rank}위</span> <span class="muted">최고 ${s.bestRank}위</span></dd></div>
            <div><dt>조건 충족</dt><dd><span class="num">${s.metCount}/${s.tracked}회</span> <span class="muted">포착 이후 기록</span></dd></div>
          </dl>
          <figure class="spark" data-code="${s.code}">
            <h3>등락률 추이 <small>${D.interval}분 회차 · 빨강 = 조건 충족</small></h3>
            <div class="spark-svg"></div>
            <figcaption>그래프를 누르거나 가리키면 회차별 값이 보입니다.</figcaption>
          </figure>
        </div>
        <div class="col">
          <div class="mat">${materials(s)}</div>
          <div class="fin">${finTable(s.fin)}</div>
        </div>
        ${memoBox(s)}
        <div class="links">
          ${s.posts.length ? `<span>텔레그램 상세 ${s.posts.filter(p => p[2]).map(([h, , url, kind]) => `<a href="${esc(url)}">${h} ${kind === "new" ? "최초" : "재료 추가"} ↗</a>`).join(" · ")}</span>` : ""}
          <a href="${esc(s.naver)}" target="_blank" rel="noopener">네이버 증권 ↗</a>
        </div>
      </div>
    </details>`).join("");

  // 등락률 추이 — 0~30% 공통 눈금, KRX 정규장 음영, 조건선
  function drawSpark(fig) {
    const s = BY_CODE[fig.dataset.code], box = fig.querySelector(".spark-svg");
    const w = Math.max(280, Math.round(box.clientWidth || 480)), h = 160, L = 34, R = 62, TP = 16, B = 24;
    const x = i => L + i * (w - L - R) / Math.max(1, LAST), y = p => TP + (30 - Math.max(0, Math.min(30, p))) / 30 * (h - TP - B);
    let trk = "", met = "";
    for (let i = 0; i < N; i++) {
      if (!s.series[i]) continue;
      const pt = `${x(i).toFixed(1)},${y(s.flus[i]).toFixed(1)}`;
      trk += `${i > 0 && s.series[i - 1] ? "L" : "M"}${pt}`;
      if (s.met[i]) met += `${i > 0 && s.met[i - 1] ? "L" : "M"}${pt}`;
    }
    const grid = [0, C.flu, 20, 30].map(v => `<line class="${v === C.flu ? "sv-thr" : "sv-grid"}" x1="${L}" x2="${w - R}" y1="${y(v)}" y2="${y(v)}"/>` +
      `<text class="sv-lbl" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}${v === 30 ? "%" : ""}</text>`).join("");
    const ticks = ["09:00", "12:00", "15:30", "20:00"].map(t => [T.indexOf(t), t]).filter(([i]) => i >= 0)
      .map(([i, t]) => `<text class="sv-lbl" x="${x(i)}" y="${h - 6}" text-anchor="middle">${t}</text>`).join("");
    const k0 = T.indexOf("09:00"), k1 = T.indexOf("15:30");
    const band = k0 >= 0 && k1 > k0 ? `<rect class="sv-band" x="${x(k0)}" y="${TP}" width="${x(k1) - x(k0)}" height="${h - TP - B}"/>` : "";
    const posts = s.posts.filter(p => p[1] != null && p[1] !== s.firstSlot && s.series[p[1]])
      .map(([, i]) => `<circle class="sv-post" cx="${x(i)}" cy="${y(s.flus[i])}" r="4.5"/>`).join("");
    const first = s.firstSlot != null ? `<circle class="sv-first" cx="${x(s.firstSlot)}" cy="${y(s.firstFlu)}" r="4.5"/>` +
      `<text class="sv-firstlbl" x="${x(s.firstSlot)}" y="${y(s.firstFlu) - 10}" text-anchor="${s.firstSlot > LAST * 0.8 ? "end" : "middle"}">포착 ${s.firstHhmm}</text>` : "";
    const endI = D.lastSlot;
    box.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(s.name)} 등락률 추이: 포착 ${s.firstHhmm}, 종가 ${pct(s.flu)}">` +
      band + grid + ticks + `<path class="sv-trk" d="${trk}"/><path class="sv-met" d="${met}"/>` + posts + first +
      `<circle class="sv-end" cx="${x(endI)}" cy="${y(s.flu)}" r="4.5"/>` +
      `<text class="sv-endlbl" x="${x(endI) + 8}" y="${y(s.flu) + 4}">${pct(s.flu, 1)}</text>` +
      `<g class="cur" visibility="hidden"><line class="sv-cur" y1="${TP}" y2="${h - B}"/><circle class="sv-curdot" r="4"/></g>` +
      `<rect class="sv-hit" x="${L}" y="0" width="${w - L - R}" height="${h}"/></svg>`;
    const svg = box.firstChild, g = svg.querySelector(".cur"), cap = fig.querySelector("figcaption");
    const move = e => {
      const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * w / r.width;
      let i = Math.max(0, Math.min(LAST, Math.round((px - L) / (w - L - R) * LAST)));
      if (!s.series[i]) return;
      g.setAttribute("visibility", "visible");
      g.querySelector("line").setAttribute("x1", x(i)); g.querySelector("line").setAttribute("x2", x(i));
      const c = g.querySelector("circle"); c.setAttribute("cx", x(i)); c.setAttribute("cy", y(s.flus[i]));
      cap.innerHTML = `<b class="num">${T[i]}</b> · ${sp(s.flus[i])} · <span class="num">${won(s.prices[i])}원</span> · ${s.ranks[i]}위 · ` +
        `<span class="num">${eok(s.tvs[i])}</span> · ${s.met[i] ? "조건 충족" : "조건 미달"}`;
    };
    svg.addEventListener("pointermove", move);
    svg.addEventListener("pointerdown", move);
  }
  const figs = [...document.querySelectorAll(".spark")];
  figs.forEach(drawSpark);
  figs.forEach(f => f.closest(".card").addEventListener("toggle", e => { if (e.target.open) drawSpark(f); }));
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => figs.forEach(drawSpark), 150); });

  // ── 메모 입력·자동 저장 (사이트에서만) ─────────────────
  //   ../memo.js 가 비공개 메모 저장소(GitHub)에 저장한다. 저장 전 입력은 이 기기에 보관했다가 다시 보낸다.
  const savebar = document.getElementById("savebar"), savemsg = document.getElementById("savemsg");
  const retryBtn = document.getElementById("saveAll");
  let retryFn = null;
  function showBar(msg, fn) { savemsg.textContent = msg; retryFn = fn; retryBtn.hidden = !fn; savebar.hidden = false; }
  const hideBar = () => { savebar.hidden = true; };
  retryBtn.addEventListener("click", () => retryFn && retryFn());
  const setStatus = (code, t) => { const el = document.getElementById(`st-${code}`); if (el) el.textContent = t; };
  function refreshMemoUI() {
    S.forEach(s => { document.querySelector(`[data-chip="${s.code}"]`).hidden = !memoText(DATE, s.code); });
  }
  function onMemoChange(state, keys, err) {
    const mine = keys.filter(([d, c]) => d === DATE && BY_CODE[c]).map(([, c]) => c);
    const t = state === "saving" ? "저장 중…" : state === "saved" ? `저장됨 ${hm(new Date())}` : "저장 실패 · 이 기기에 보관 중, 곧 다시 시도";
    mine.forEach(c => setStatus(c, t));
    if (state === "error") showBar(`메모 저장 실패 — ${err?.message || "연결 오류"}`, () => memoApi.flush());
    else if (state === "saved") hideBar();
  }
  async function initMemo() {
    hideBar();
    try {
      memoApi ||= await import(new URL("../memo.js", location.href).href);
      const years = [...new Set([DATE, ...S.flatMap(s => s.history.map(([d]) => d))].map(d => d.slice(0, 4)))];
      const all = await memoApi.load(years);
      for (const k of Object.keys(MEMO)) delete MEMO[k];
      Object.assign(MEMO, all);
      memoApi.onChange(onMemoChange);
      S.forEach(s => {
        const ta = document.getElementById(`memo-${s.code}`);
        ta.value = memoText(DATE, s.code);
        ta.disabled = false;
        setStatus(s.code, memoApi.isPending(DATE, s.code) ? "이 기기에 보관 중 · 곧 저장" : memoText(DATE, s.code) ? "저장됨" : "메모 없음");
        document.getElementById(`hist-${s.code}`).innerHTML = historyList(s);
      });
      refreshMemoUI(); renderFilters(); renderTable();
    } catch (e) {
      S.forEach(s => setStatus(s.code, "메모를 불러오지 못했습니다"));
      showBar(`메모 저장소에 연결하지 못했습니다 — ${e.message}`, initMemo);
    }
  }
  let tt;
  cards.addEventListener("input", e => {
    const ta = e.target.closest("textarea[data-code]"); if (!ta || !memoApi) return;
    const code = ta.dataset.code, t = ta.value.trim();
    (MEMO[DATE] ||= {})[code] = { t, at: Date.now() };
    memoApi.set(DATE, code, t);
    setStatus(code, "입력 중…");
    clearTimeout(tt);
    tt = setTimeout(() => { refreshMemoUI(); renderFilters(); renderTable(); }, 250);
  });
  cards.addEventListener("focusout", e => { if (e.target.matches("textarea[data-code]") && memoApi) memoApi.flush(); });
  cards.addEventListener("keydown", e => {
    if (e.target.matches("textarea[data-code]") && e.key === "Enter" && (e.ctrlKey || e.metaKey) && memoApi) { e.preventDefault(); memoApi.flush(); }
  });
  addEventListener("beforeunload", e => {
    if (memoApi && memoApi.hasPending()) { memoApi.flush(); e.preventDefault(); e.returnValue = ""; }
  });
  if (HOSTED) initMemo();

  // 이름 링크로 이동하면 카드 펼치기 · 모두 접기
  document.addEventListener("click", e => {
    const a = e.target.closest('a[href^="#s-"]'); if (!a) return;
    const d = document.getElementById(a.getAttribute("href").slice(1)); if (d) d.open = true;
  });
  const tg = document.getElementById("toggleAll");
  tg.addEventListener("click", () => {
    const all = [...document.querySelectorAll(".card")], open = all.some(d => d.open);
    all.forEach(d => { d.open = !open; });
    tg.textContent = open ? "모두 펼치기" : "모두 접기";
  });
})();
</script>
</body>
</html>
